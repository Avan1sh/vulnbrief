name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.10'
    env:
      GROQ_API_KEY: ''
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Check dependencies and publication hygiene
        run: |
          python -m pip check
          python scripts/audit_repository.py
      - name: Check frontend syntax
        run: node --check src/vulnbrief/web/app.js
      - name: Run unit and local API tests
        run: python -m pytest -q --junitxml=test-results/junit.xml
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload test results and wheel
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: checks-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            test-results/junit.xml
            dist/*.whl
          if-no-files-found: warn
          retention-days: 14
