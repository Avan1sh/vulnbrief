[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnbrief"
version = "0.2.0"
description = "A bounded, evidence-grounded vulnerability investigation agent"
requires-python = ">=3.10"
dependencies = [
  "groq==0.37.1",
  "httpx==0.28.1",
  "langgraph==1.2.22",
  "pydantic==2.14.3",
  "python-dotenv==1.2.4",
  "beautifulsoup4==4.15.0",
  "fastapi==0.162.5",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "build==1.6.1"]

[project.scripts]
vulnbrief = "vulnbrief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulnbrief = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
